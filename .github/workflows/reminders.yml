name: Daily reminders

# Runs every hour (a few minutes past). Each run sends whoever is due a
# reminder in their own timezone. GitHub can start scheduled runs a little
# late; the job allows for that. You can also run it by hand from Actions.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts/reminders
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node send.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
